<meta name="apple-mobile-web-app-title" content="Mi Caja">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f5f2ec;--card:#fff;--ink:#1d1d1b;--mut:#7a766d;--line:#e7e2d7;
  --in:#1d8a4b;--in-bg:#e4f3ea;--out:#c7412d;--out-bg:#fbe8e3;--box:#3556c9;--box-bg:#e7ecfb;
  --warn:#b7791f;--warn-bg:#fdf3dc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.35}
header{background:var(--ink);color:#fff;padding:18px 18px 16px;padding-top:calc(18px + env(safe-area-inset-top))}
header .fecha{font-size:14px;opacity:.7}
header h1{margin:2px 0 0;font-size:22px;font-weight:700}
main{max-width:620px;margin:0 auto;padding:14px 14px 120px}
section[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .lbl{font-size:13px;color:var(--mut)}
.stat .val{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
.stat.total{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border:none}
.stat.total .lbl{color:#cfcabf}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:20px 4px 10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbtn{border:none;border-radius:14px;padding:16px 12px;font-size:16px;font-weight:700;text-align:left;cursor:pointer;min-height:64px}
.tbtn small{display:block;font-weight:500;font-size:12px;opacity:.75;margin-top:3px}
.tbtn.entra{background:var(--in-bg);color:var(--in)}
.tbtn.sale{background:var(--out-bg);color:var(--out)}
.tbtn.caja{background:var(--box-bg);color:var(--box)}
.mov{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.mov:last-child{border-bottom:none}
.mov .h{font-size:13px;color:var(--mut);width:48px;flex-shrink:0}
.mov .d{flex:1;min-width:0}
.mov .d b{display:block;font-size:15px}
.mov .d span{display:block;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .m{font-weight:800;font-size:16px;white-space:nowrap}
.pos{color:var(--in)}.neg{color:var(--out)}.neu{color:var(--box)}
.empty{color:var(--mut);text-align:center;padding:18px 0;font-size:15px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 14px;font-weight:600;font-size:15px;margin-bottom:12px;cursor:pointer}
.primary{display:block;width:100%;border:none;border-radius:14px;padding:17px;font-size:17px;font-weight:800;background:var(--ink);color:#fff;cursor:pointer;margin-top:10px}
.primary.green{background:var(--in)}
.ghost{display:block;width:100%;border:1px solid var(--line);border-radius:14px;padding:15px;font-size:16px;font-weight:600;background:transparent;color:var(--ink);cursor:pointer;margin-top:8px}
.danger{color:var(--out);border-color:#efc4ba}
.link{background:none;border:none;color:var(--mut);text-decoration:underline;font-size:14px;padding:10px 0;cursor:pointer;display:block;margin:6px auto 0}
.den{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.den:last-child{border-bottom:none}
.den .v{flex:1;font-weight:700}
.den .v small{font-weight:500;color:var(--mut);font-size:12px;margin-left:4px}
.den button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#faf8f4;font-size:22px;font-weight:700;cursor:pointer;color:var(--ink)}
.den input{width:60px;height:42px;text-align:center;font-size:18px;font-weight:700;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.den .sub{width:104px;text-align:right;font-size:14px;color:var(--mut)}
.field{margin-top:6px}
.field label{display:block;font-size:14px;color:var(--mut);margin-bottom:6px}
.inp{width:100%;font-size:18px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.inp.big{font-size:30px;font-weight:800;text-align:center;padding:16px}
.sticky{position:sticky;bottom:78px;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.sticky b{font-size:24px}
.res-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.res-row:last-child{border-bottom:none}
.res-row b{font-size:16px}
.pista{border-radius:12px;padding:12px 14px;margin-top:8px;font-size:15px}
.pista.ok{background:var(--in-bg);color:var(--in);font-weight:700}
.pista.info{background:var(--box-bg);color:var(--box);font-weight:600}
.pista.mal{background:var(--out-bg);color:var(--out);font-weight:700}
.pista.warn{background:var(--warn-bg);color:var(--warn);font-weight:700}
.pista.look{background:#f3f1ec;color:var(--ink)}
.pista.tip{background:transparent;color:var(--mut);border:1px dashed var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:#faf8f4;border-radius:999px;padding:9px 13px;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink)}
.day{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.day:last-child{border-bottom:none}
.day b{display:block}
.day span{font-size:13px;color:var(--mut)}
.tag{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--in-bg);color:var(--in)}
.tag.mal{background:var(--out-bg);color:var(--out)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.gris{background:#efece6;color:var(--mut)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;border:none;background:none;padding:12px 0 14px;font-size:14px;font-weight:700;color:var(--mut);cursor:pointer}
nav.tabs button .ic{display:block;font-size:22px;margin-bottom:2px}
nav.tabs button.on{color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(20,18,15,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:620px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
.sheet h3{margin:0 0 2px;font-size:22px}
.sheet .sub{color:var(--mut);font-size:14px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;font-size:15px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.mes{display:flex;justify-content:space-between;align-items:center}
.mes .val{font-size:22px;font-weight:800}
.muted{color:var(--mut);font-size:14px}
.turnos{padding:6px 14px}
.scanbtn{display:block;width:100%;border:none;border-radius:16px;padding:18px;margin-bottom:12px;background:var(--ink);color:#fff;font-size:19px;font-weight:800;cursor:pointer;text-align:left}
.scanbtn small{display:block;font-size:13px;font-weight:500;opacity:.7;margin-top:3px}
.barra{height:10px;background:#e7e2d7;border-radius:99px;overflow:hidden;margin:16px 0 8px}
.barra div{height:100%;width:5%;background:var(--in);transition:width .2s}
.mini{display:block;max-width:100%;max-height:180px;margin:4px auto 10px;border-radius:12px;border:1px solid var(--line)}
select.inp{appearance:auto}
.crudo{margin-top:12px;color:var(--mut);font-size:13px}
.crudo pre{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:200px;overflow:auto}

.turno:last-child{border-bottom:none}

/* ===== Diseño v6: claro, suave, sencillo ===== */
:root{--bg:#fdf2f4;--card:#ffffff;--ink:#3b2f35;--mut:#9b8b92;--line:#f3e3e8;
  --rosa:#e9799c;--rosa2:#f7b6c9;--rosa-bg:#fde6ed;--sol:#fff3d9;--lila:#eeeaff;--menta:#e3f5ea;
  --in:#2f9e63;--in-bg:#e3f5ea;--out:#e0606e;--out-bg:#fde8ea;--box:#7c6ad6;--box-bg:#eeeaff;--warn:#c98a1b;--warn-bg:#fff3d9}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px}
header{background:transparent;color:var(--ink);padding:calc(16px + env(safe-area-inset-top)) 20px 4px}
header .fecha{display:none}
header h1{font-size:24px;font-weight:800;margin:0}
body.en-hoy header{display:none}
main{max-width:520px;padding:10px 18px 130px}
body.en-hoy main{padding-top:calc(18px + env(safe-area-inset-top))}
.card{background:var(--card);border:none;border-radius:20px;padding:14px 16px;box-shadow:0 2px 10px rgba(233,121,156,.08);margin-bottom:12px}
h2{display:none}
.sec{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:800;margin:20px 2px 10px}
.sec a{font-size:14px;color:var(--rosa);font-weight:700;cursor:pointer}
/* Saludo */
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.hola{font-size:26px;font-weight:800;line-height:1.15}
.hola span{color:var(--rosa)}
.top .sub{color:var(--mut);font-size:14px;margin-top:4px}
.icbtn{width:42px;height:42px;border-radius:50%;border:none;background:#fff;box-shadow:0 2px 8px rgba(233,121,156,.15);font-size:19px;cursor:pointer}
/* Tarjeta resumen */
.resumen{background:linear-gradient(135deg,#f6a7bf,#ee88a9);color:#fff;border-radius:24px;padding:18px;margin-bottom:6px;box-shadow:0 10px 24px rgba(233,121,156,.28)}
.resumen .t{font-size:14px;opacity:.9;font-weight:600}
.resumen .grande{font-size:32px;font-weight:800;margin:4px 0 2px;letter-spacing:-.5px}
.resumen .peq{font-size:13px;opacity:.9}
.resumen .filas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.resumen .filas div{background:rgba(255,255,255,.22);border-radius:14px;padding:9px 11px;font-size:12px}
.resumen .filas b{display:block;font-size:16px;margin-top:2px}
.pill{display:flex;align-items:center;justify-content:space-between;width:100%;background:#fff;color:var(--rosa);border:none;border-radius:999px;padding:12px 18px;font-size:15px;font-weight:800;cursor:pointer}
/* Conteos */
.cont{display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.cont .e{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:19px}
.cont .d{flex:1}.cont .d b{display:block;font-size:15px}.cont .d small{color:var(--mut);font-size:13px}
.cont .ok{width:28px;height:28px;border-radius:50%;background:var(--rosa);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:800}
.cont .fl{color:var(--mut);font-size:20px}
.cont.c0{background:var(--sol)}.cont.c1{background:var(--rosa-bg)}.cont.c2{background:var(--lila)}
.cont .ok.mal{background:var(--out)}.cont .ok.warn{background:var(--warn)}
/* Consejo */
.tip{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:14px;font-size:14px;color:var(--ink);box-shadow:0 2px 10px rgba(233,121,156,.08)}
.tip .e{font-size:24px}
/* Movimientos */
.mov{padding:10px 0;gap:10px}
.mov .ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex-shrink:0}
.mov .h{display:none}
.mov .d b{font-size:14px}.mov .d span{font-size:12px}
.mov .m{font-size:15px}
.mov .hr{font-size:12px;color:var(--mut);text-align:right;display:block;font-weight:500}
/* Lista para escoger tipo */
.grp{font-size:13px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:16px 4px 6px}
.fila{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:none;border-radius:16px;padding:10px 12px;margin-bottom:6px;text-align:left;cursor:pointer;color:var(--ink);box-shadow:0 1px 6px rgba(233,121,156,.07)}
.fila .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.fila b{display:block;font-size:15px}.fila small{display:block;font-size:12px;color:var(--mut)}
.fila .fl{margin-left:auto;color:var(--mut);font-size:20px}
.t-entra{background:var(--in-bg)}.t-sale{background:var(--out-bg)}.t-caja{background:var(--box-bg)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.quick button{border:none;border-radius:16px;padding:14px 10px;font-size:14px;font-weight:700;cursor:pointer;background:var(--rosa-bg);color:var(--ink)}
.quick button span{display:block;font-size:22px;margin-bottom:4px}
/* Navegación */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border:none;border-radius:24px 24px 0 0;display:flex;align-items:center;padding:6px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(233,121,156,.10);max-width:none;margin:0}
nav.tabs button{flex:1;background:none;border:none;color:var(--mut);font-size:11px;font-weight:600;padding:6px 0;border-radius:12px}
nav.tabs button .ic{display:block;font-size:20px;margin-bottom:1px;filter:grayscale(1);opacity:.6}
nav.tabs button.on{color:var(--rosa);background:none}
nav.tabs button.on .ic{filter:none;opacity:1}
nav.tabs .mas{flex:0 0 62px;height:62px;border-radius:50%;background:var(--rosa);color:#fff;font-size:32px;font-weight:300;margin-top:-26px;box-shadow:0 8px 18px rgba(233,121,156,.4);padding:0;line-height:1}
/* Generales */
.primary{background:var(--rosa);border-radius:999px;font-size:16px;padding:15px}
.primary.green{background:var(--rosa)}
.ghost{border-radius:999px;border:1px solid var(--line);background:#fff;font-size:15px;padding:13px}
.inp{border-radius:14px;border:1px solid var(--line)}
.inp.big{font-size:28px}
.sheet{background:var(--bg);border-radius:26px 26px 0 0}
.sheet h3{font-size:20px}
.sticky{bottom:88px;border-radius:999px;background:var(--rosa);box-shadow:0 8px 20px rgba(233,121,156,.35)}
.toast{bottom:96px;background:var(--ink)}
.banner{border-radius:16px;font-size:14px}
.tag{font-size:12px;padding:4px 9px}
.tag.ok{background:var(--in-bg)}
.den{padding:7px 0}.den .v{white-space:nowrap;font-size:16px;flex:0 0 108px}.den .v small{display:block;margin:0}
.den button{width:38px;height:38px;border-radius:50%;background:var(--rosa-bg);border:none;color:var(--rosa);font-size:20px}
.den input{width:56px;height:38px;border-radius:12px;font-size:17px}
.den .sub{width:84px;font-size:13px}
.res-row{font-size:14px}
.pista{border-radius:14px;font-size:14px}
.day{padding:12px 2px}
.mas-item{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:none;border-radius:16px;padding:14px;margin-bottom:8px;font-size:15px;font-weight:600;text-align:left;cursor:pointer;color:var(--ink);box-shadow:0 1px 6px rgba(233,121,156,.07)}
.mas-item span{font-size:20px}
/* Verificación de montos */
.letras{margin:8px 2px 0;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:22px}
.letras b{font-size:15px;color:var(--rosa)}
.letras .cifras{font-size:12px;color:var(--mut)}
.voz{border:none;background:var(--rosa-bg);border-radius:50%;width:32px;height:32px;font-size:15px;cursor:pointer}
.alto{background:var(--warn-bg);color:var(--warn);border-radius:16px;padding:12px;margin-top:10px;font-size:14px}
.alto.ok{background:var(--in-bg);color:var(--in)}.alto.ok .alto-bt{display:none}
.alto-bt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.alto-bt button{border:none;border-radius:999px;padding:10px 6px;font-weight:800;font-size:13px;cursor:pointer;background:#fff;color:var(--ink)}
.alto-bt button+button{background:var(--rosa);color:#fff}
.sacude{animation:sac .4s}@keyframes sac{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pend{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px dashed var(--rosa2);border-radius:18px;padding:12px 14px;margin:12px 0 0;font-size:14px}
.pend small{display:block;color:var(--mut);font-size:12px}
.pend button{background:var(--rosa-bg);color:var(--rosa);border:none;border-radius:50%;width:30px;height:30px;cursor:pointer}
.pista.grande{font-size:16px}
/* ===== v7 ===== */
.guardado-chip{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--in);background:var(--in-bg);border-radius:999px;padding:3px 10px}
.guardado-chip:empty{display:none}
.guardado-chip.mal{color:var(--out);background:var(--out-bg)}
header .guardado-chip{margin-top:4px}
.aviso{background:#fff;border-left:4px solid var(--rosa);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.4;cursor:pointer;box-shadow:0 2px 10px rgba(233,121,156,.08)}
.aviso b{display:block;margin-bottom:2px}
.aviso.rojo{border-left-color:var(--out);background:var(--out-bg)}
.grande-op{display:flex;align-items:center;gap:14px;width:100%;border:none;border-radius:20px;padding:16px;margin:8px 0;text-align:left;cursor:pointer;color:var(--ink)}
.grande-op.entra{background:var(--in-bg)}.grande-op.sale{background:var(--out-bg)}
.grande-op .gi{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.grande-op b{display:block;font-size:17px}.grande-op small{display:block;font-size:13px;color:var(--mut);margin-top:2px}
.atras{background:none;border:none;color:var(--rosa);font-size:16px;font-weight:700;padding:0 0 8px;cursor:pointer}
.lab{display:block;font-size:14px;font-weight:700;color:var(--mut);margin:6px 2px 6px}
.extra{margin-top:12px;color:var(--mut);font-size:14px}.extra summary{cursor:pointer;padding:6px 2px}.extra .inp{margin-top:8px}
.conf-monto{background:#fff;border-radius:20px;text-align:center;padding:20px 12px;margin:10px 0 6px;font-size:36px;font-weight:800;color:var(--ink)}
.conf-monto small{display:block;font-size:15px;color:var(--rosa);margin-top:6px;letter-spacing:.3px}
.bienv{font-size:46px;text-align:center;margin:4px 0 2px}
.paso{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:16px;padding:12px;margin-bottom:8px}
.paso>span{width:28px;height:28px;border-radius:50%;background:var(--rosa);color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.paso b{display:block;font-size:15px}.paso small{display:block;font-size:13px;color:var(--mut);margin-top:2px}
.link{color:var(--rosa)}
.paso small b{display:inline;font-size:inherit}
.toast{top:calc(14px + env(safe-area-inset-top));bottom:auto!important;transform:translateX(-50%) translateY(-8px)}
.toast.on{transform:translateX(-50%) translateY(0)}
</style>

<body>
<header>
  <div class="fecha" id="fecha"></div>
  <h1 id="titulo">Caja</h1><div class="guardado-chip"></div>
</header>

<main>
  <section id="v-hoy"></section>
  <section id="v-contar" hidden></section>
  <section id="v-hist" hidden></section>
  <section id="v-mas" hidden></section>
</main>

<nav class="tabs">
  <button data-tab="hoy" class="on"><span class="ic">🏠</span>Inicio</button>
  <button data-tab="contar"><span class="ic">💵</span>Contar</button>
  <button class="mas" data-act="agregar" aria-label="Anotar">+</button>
  <button data-tab="hist"><span class="ic">📅</span>Historial</button>
  <button data-tab="mas"><span class="ic">⚙️</span>Más</button>
</nav>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
/* ====== Configuración ====== */
const DENOMS=[100000,50000,20000,10000,5000,2000,1000,500,200,100,50];
const TIPOS=[
  {id:'deposito', n:'Consignación Bancolombia',s:'Entra efectivo', ef:1,  sp:-1, g:'entra'},
  {id:'nequi_in', n:'Recarga Nequi',         s:'Entra efectivo', ef:1,  sp:-1, g:'entra'},
  {id:'factura',  n:'Pago de factura',       s:'Entra efectivo', ef:1,  sp:-1, g:'entra'},
  {id:'tc',       n:'Pago tarjeta de crédito',s:'Entra efectivo',ef:1,  sp:-1, g:'entra'},
  {id:'credito',  n:'Pago de crédito',       s:'Entra efectivo', ef:1,  sp:-1, g:'entra'},
  {id:'otro_in',  n:'Otro que entra',        s:'Entra efectivo', ef:1,  sp:-1, g:'entra'},
  {id:'retiro',   n:'Retiro con tarjeta',    s:'Sale efectivo',  ef:-1, sp:1,  g:'sale'},
  {id:'retiro_cod',n:'Retiro con código',    s:'Sin tarjeta',    ef:-1, sp:1,  g:'sale'},
  {id:'nequi_out',n:'Retiro Nequi',          s:'Sale efectivo',  ef:-1, sp:1,  g:'sale'},
  {id:'avance',   n:'Avance tarjeta crédito',s:'Sale efectivo',  ef:-1, sp:1,  g:'sale'},
  {id:'otro_out', n:'Otro que sale',         s:'Sale efectivo',  ef:-1, sp:1,  g:'sale'},
  {id:'meter',    n:'Metí plata a la caja',  s:'De mi bolsillo', ef:1,  sp:0,  g:'caja'},
  {id:'sacar',    n:'Saqué plata de la caja',s:'Gasto o personal',ef:-1,sp:0,  g:'caja'},
  {id:'fondeo',   n:'Consigné para recuperar cupo',s:'Llevé efectivo al banco',ef:-1,sp:1,g:'caja'},
  {id:'comision', n:'Me pagaron comisión',   s:'Entró al cupo',  ef:0,  sp:1,  g:'caja'},
  {id:'ajuste_sp',n:'Me descontaron del cupo',s:'Cobro del banco',ef:0, sp:-1, g:'caja'},
];
// Compatibilidad con datos viejos
const VIEJOS={recarga:{id:'recarga',n:'Recarga',s:'',ef:1,sp:-1,g:'x'},envio:{id:'envio',n:'Envío / giro',s:'',ef:1,sp:-1,g:'x'},giro_pago:{id:'giro_pago',n:'Pago de giro',s:'',ef:-1,sp:1,g:'x'}};
const TURNOS=[{n:'Mañana',ic:'☀️'},{n:'Mediodía',ic:'🌤️'},{n:'Cierre',ic:'🌙'}];
const turnoNombre=i=>i<3?TURNOS[i].n:'Conteo extra';
const EMO={deposito:'🏦',nequi_in:'📱',factura:'🧾',tc:'💳',credito:'📄',otro_in:'➕',retiro:'💵',retiro_cod:'🔢',nequi_out:'📱',avance:'💳',otro_out:'➖',meter:'👛',sacar:'🛍️',fondeo:'🏧',comision:'⭐',ajuste_sp:'✂️'};
const TIPO=Object.assign({},VIEJOS,Object.fromEntries(TIPOS.map(t=>[t.id,t])));
const KEY='caja_corresponsal_v1';

/* ====== Datos (guardado doble: memoria del navegador + base interna) ====== */
let S=load();
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.days)return o}}catch(e){}return{days:{}}}
let ULT_GUARDADO=S.savedAt||0,FALLO_GUARDAR=false;
function idb(){return new Promise((ok,mal)=>{try{const r=indexedDB.open('caja_corresponsal',1);r.onupgradeneeded=()=>r.result.createObjectStore('d');r.onsuccess=()=>ok(r.result);r.onerror=()=>mal(r.error)}catch(e){mal(e)}})}
function idbPut(v){return idb().then(db=>new Promise((ok,mal)=>{const tx=db.transaction('d','readwrite');tx.objectStore('d').put(v,'estado');tx.oncomplete=ok;tx.onerror=()=>mal(tx.error)})).catch(()=>{})}
function idbGet(){return idb().then(db=>new Promise(ok=>{const q=db.transaction('d').objectStore('d').get('estado');q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)})).catch(()=>null)}
function save(){
  S.savedAt=Date.now();const txt=JSON.stringify(S);let ok=false;
  try{localStorage.setItem(KEY,txt);ok=localStorage.getItem(KEY)===txt}catch(e){ok=false}
  idbPut(txt);
  FALLO_GUARDAR=!ok;ULT_GUARDADO=S.savedAt;pintarGuardado();
  if(!ok)toast('⚠️ No se pudo guardar en el celular');
  return ok;
}
function pintarGuardado(){document.querySelectorAll('.guardado-chip').forEach(el=>{
  if(FALLO_GUARDAR){el.className='guardado-chip mal';el.textContent='⚠️ No se está guardando'}
  else if(ULT_GUARDADO){el.className='guardado-chip';el.textContent='✓ Todo guardado · '+hora(ULT_GUARDADO)}
  else el.textContent=''})}
// Al abrir: si la base interna tiene algo más nuevo, se usa eso
idbGet().then(t=>{if(!t)return;try{const o=JSON.parse(t);if(o&&o.days&&(o.savedAt||0)>(S.savedAt||0)){S=o;try{localStorage.setItem(KEY,t)}catch(e){}ULT_GUARDADO=S.savedAt;render()}}catch(e){}});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
// Borradores: lo que se está escribiendo no se pierde si el celular recarga la página
const BKEY=KEY+'_borrador';
function guardarBorrador(b){try{if(b)localStorage.setItem(BKEY,JSON.stringify(Object.assign(b,{ts:Date.now()})));else localStorage.removeItem(BKEY)}catch(e){}}
function leerBorrador(){try{const b=JSON.parse(localStorage.getItem(BKEY)||'null');if(b&&Date.now()-b.ts<3*3600e3)return b}catch(e){}return null}
// Dónde se está abriendo la app
const UA=navigator.userAgent||'';
const ES_IOS=/iPhone|iPad|iPod/.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const EN_APP_AJENA=/FBAN|FBAV|Instagram|WhatsApp|Line\/|TikTok|Snapchat/i.test(UA);
const COMO_APP=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const pad=n=>String(n).padStart(2,'0');
function hoyKey(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function getDay(k){return S.days[k]||null}
function day(k=hoyKey()){return S.days[k]||(S.days[k]={apertura:null,movs:[],arqueos:[]})}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ====== Utilidades ====== */
function miles(n){return Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function fmt(n){return (n<0?'−':'')+'$\u00a0'+miles(n)}
function num(s){return parseInt(String(s).replace(/\D/g,''),10)||0}
function hora(ts){const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function fechaLarga(k){const [y,m,d]=k.split('-').map(Number);return cap(new Date(y,m-1,d).toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'}))}
function esperado(d,hasta=Infinity){let ef=d.apertura.ef,sp=d.apertura.sp;for(const m of d.movs){if(m.ts>hasta)continue;const t=TIPO[m.tipo];if(!t)continue;ef+=t.ef*m.monto;sp+=t.sp*m.monto}return{ef,sp}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),2200)}
function signo(m){const t=TIPO[m.tipo];if(t.ef>0)return['pos','+'];if(t.ef<0)return['neg','−'];return['neu',t.sp>0?'+':'−']}

/* ====== Pistas para encontrar el descuadre ====== */
function swaps(n){const s=String(n),o=[];for(let i=0;i<s.length-1;i++){if(s[i]===s[i+1])continue;const a=s.split('');[a[i],a[i+1]]=[a[i+1],a[i]];if(a[0]==='0')continue;o.push(Math.abs(n-parseInt(a.join(''),10)))}return o}
function pistas(difEf,difSp,movs){
  const out=[],seen=new Set();
  const add=(k,t)=>{if(!seen.has(t)){seen.add(t);out.push({k,t})}};
  const tot=difEf+difSp;
  if(difEf===0&&difSp===0){add('ok','✅ Todo cuadra. La plata está completa.');return out}
  if(tot===0){
    const x=fmt(Math.abs(difEf));
    add('info',difEf>0
      ?`La plata está completa. Sobran ${x} en efectivo y faltan ${x} en la plataforma: casi seguro hiciste un depósito o pago de ${x} y no lo anotaste.`
      :`La plata está completa. Faltan ${x} en efectivo y sobran ${x} en la plataforma: casi seguro hiciste un retiro de ${x} y no lo anotaste.`);
  }else{
    add(tot<0?'mal':'warn',tot<0
      ?`❗ Faltan ${fmt(-tot)} sumando efectivo y plataforma. Esta sí es plata que no aparece.`
      :`Sobran ${fmt(tot)} sumando efectivo y plataforma.`);
  }
  const analizar=(dif,donde)=>{
    if(!dif)return;const a=Math.abs(dif);
    movs.filter(m=>m.monto===a).slice(0,3).forEach(m=>add('look',`🔎 ${donde}: el ${TIPO[m.tipo].n.toLowerCase()} de ${fmt(a)} (${hora(m.ts)}) da justo la diferencia. ¿Se anotó dos veces, o la transacción salió rechazada y no se hizo?`));
    movs.filter(m=>m.monto*2===a).slice(0,3).forEach(m=>add('look',`🔎 ${donde}: ¿el ${TIPO[m.tipo].n.toLowerCase()} de ${fmt(m.monto)} (${hora(m.ts)}) se anotó al revés? (como entrada cuando era salida, o al contrario)`));
    movs.filter(m=>m.monto*9===a||(m.monto%10===0&&m.monto/10*9===a)).slice(0,3).forEach(m=>add('look',`🔎 ${donde}: al ${TIPO[m.tipo].n.toLowerCase()} de ${fmt(m.monto)} (${hora(m.ts)}) ¿le sobra o le falta un cero?`));
    movs.filter(m=>swaps(m.monto).includes(a)).slice(0,3).forEach(m=>add('look',`🔎 ${donde}: ¿el de ${fmt(m.monto)} (${hora(m.ts)}) era otro número con dos cifras al revés? (ej. 52.000 y 25.000)`));
    if(tot!==0&&DENOMS.includes(a))add('look',`🔎 Es justo ${a>=2000?'un billete':'una moneda'} de ${fmt(a)}: revisa si diste uno de más en un cambio, si hay billetes pegados o uno guardado aparte.`);
  };
  if(tot===0)analizar(difEf,'Efectivo');
  else{analizar(difEf,'Efectivo');analizar(difSp,'Plataforma')}
  if(tot<0)add('tip','Otras causas comunes: billete falso, cambio mal dado, plata personal mezclada con la de la caja, o un retiro que salió rechazado pero igual se entregó la plata.');
  return out;
}

const CKEY=KEY+'_conteo';
let C=(()=>{try{const c=JSON.parse(localStorage.getItem(CKEY)||'null');if(c&&c.dia===hoyKey())return{q:c.q||{},sp:c.sp||'',res:null}}catch(e){}return{q:{},sp:'',res:null}})();
function guardarConteo(){try{localStorage.setItem(CKEY,JSON.stringify({dia:hoyKey(),q:C.q,sp:C.sp}))}catch(e){}}
function borrarConteo(){C={q:{},sp:'',res:null};try{localStorage.removeItem(CKEY)}catch(e){}}
function totalContado(){return DENOMS.reduce((s,v)=>s+v*(C.q[v]||0),0)}
function filaMov(m){const [c,sg]=signo(m);return`<div class="mov" style="cursor:default"><div class="h">${hora(m.ts)}</div><div class="d"><b>${TIPO[m.tipo].n}</b>${m.nota?`<span>${esc(m.nota)}</span>`:''}</div><div class="m ${c}">${sg} ${fmt(m.monto)}</div></div>`}
function vContar(){
  const el=document.getElementById('v-contar');const d=getDay(hoyKey());const ap=!d||!d.apertura;
  const rows=DENOMS.map(v=>`<div class="den"><div class="v">${fmt(v)}<small>${v>=2000?'billete':'moneda'}</small></div>
    <button data-act="q" data-v="${v}" data-d="-1">−</button>
    <input type="number" inputmode="numeric" min="0" data-q="${v}" value="${C.q[v]||''}" placeholder="0">
    <button data-act="q" data-v="${v}" data-d="1">+</button>
    <div class="sub" id="sub-${v}">${C.q[v]?fmt(v*C.q[v]):''}</div></div>`).join('');
  let res='';
  if(C.res&&!ap){
    const r=C.res,dEf=r.ef-r.espEf,dSp=r.sp-r.espSp;
    const prev=d.arqueos.length?d.arqueos[d.arqueos.length-1]:null;
    const pEf=prev?prev.ef-prev.espEf:0,pSp=prev?prev.sp-prev.espSp:0;
    const nEf=dEf-pEf,nSp=dSp-pSp;
    const desde=prev?prev.ts:d.apertura.ts;
    const tramo=d.movs.filter(m=>m.ts>desde);
    const lin=(l,real,esp,dif)=>`<div class="res-row"><span>${l}<br><small class="muted">Debe haber ${fmt(esp)}</small></span><span style="text-align:right">${fmt(real)}<br><b class="${dif===0?'pos':dif<0?'neg':'neu'}">${dif===0?'Cuadra':(dif<0?'Faltan ':'Sobran ')+fmt(Math.abs(dif))}</b></span></div>`;
    let extra='';
    if(prev&&(pEf||pSp)){
      if(!nEf&&!nSp)extra=`<div class="pista info">Este descuadre ya venía del conteo de ${turnoNombre(d.arqueos.length-1).toLowerCase()} (${hora(prev.ts)}). Desde ese conteo hasta ahora todo cuadra: no hay error nuevo.</div>`;
      else extra=`<div class="pista warn">Ya venía un descuadre de ${fmt(pEf+pSp)} del conteo anterior. Lo nuevo desde las ${hora(prev.ts)} es: ${fmt(nEf+nSp)}.</div>`;
    }
    const ps=(nEf||nSp)?pistas(nEf,nSp,tramo):((dEf||dSp)?[]:pistas(0,0,[]));
    const tramoTxt=(nEf||nSp)?`<div class="pista look">🕐 El error pasó entre las <b>${hora(desde)}</b> y ahora. Revisa solo estos ${tramo.length} movimientos (los más grandes primero):</div>
      <div class="card" style="padding:4px 12px;margin-top:8px">${[...tramo].sort((a,b)=>b.monto-a.monto).slice(0,12).map(filaMov).join('')||'<div class="empty">No se anotó nada en ese rato: algo se hizo sin anotar.</div>'}</div>`:'';
    const esCierre=d.arqueos.length>=2;
    res=`<div class="card" id="resultado"><h3 style="margin:0 0 6px">Resultado</h3>
      ${lin('Efectivo',r.ef,r.espEf,dEf)}${lin('Plataforma',r.sp,r.espSp,dSp)}${lin('Total',r.ef+r.sp,r.espEf+r.espSp,dEf+dSp)}
      ${extra}${ps.map(p=>`<div class="pista ${p.k}">${p.t}</div>`).join('')}${tramoTxt}
      ${esCierre
        ?`<button class="primary" data-act="cerrar-dia">Guardar y cerrar el día</button><button class="ghost" data-act="guardar-arqueo">Guardar sin cerrar</button>`
        :`<button class="primary" data-act="guardar-arqueo">Guardar conteo de ${turnoNombre(d.arqueos.length).toLowerCase()}</button>`}</div>`;
  }
  const titulo=ap?'Conteo para abrir la caja':'Conteo de '+turnoNombre(d.arqueos.length).toLowerCase();
  el.innerHTML=`<div class="card"><h3 style="margin:0 0 4px">${titulo}</h3>
      <p class="muted" style="margin:0">Pon cuántos billetes y monedas hay de cada uno. La app suma sola.</p></div>
    <div class="card" style="padding:6px 14px">${rows}</div>
    <div class="card"><div class="field"><label>¿Cuánto saldo dice la plataforma ahora?</label>
      <input class="inp" id="c-sp" inputmode="numeric" autocomplete="off" placeholder="$ 0" value="${C.sp?'$ '+miles(num(C.sp)):''}"></div>
      <button class="primary ${ap?'green':''}" data-act="${ap?'abrir':'comparar'}">${ap?'Abrir la caja con esto':'Comparar con lo que debe haber'}</button>
      <button class="link" data-act="limpiar-conteo">Borrar conteo</button></div>
    ${res}
    <div class="sticky"><span>Efectivo contado</span><b id="c-total">${fmt(totalContado())}</b></div>`;
  if(C.res&&!ap)setTimeout(()=>{const r=document.getElementById('resultado');r&&r.scrollIntoView({behavior:'smooth',block:'start'})},50);
}

/* ====== Escanear comprobante (lectura de texto gratis, en el mismo celular) ====== */
let OCR=null;
function cargarLector(){
  if(window.Tesseract)return Promise.resolve();
  return new Promise((ok,mal)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.onload=ok;sc.onerror=()=>mal(new Error('sin internet'));document.head.appendChild(sc)});
}
function prepararFoto(file){
  return new Promise((ok,mal)=>{const img=new Image();img.onload=()=>{
    const esc=Math.min(1,1800/Math.max(img.width,img.height));const w=Math.round(img.width*esc),h=Math.round(img.height*esc);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.drawImage(img,0,0,w,h);
    const px=cx.getImageData(0,0,w,h),dd=px.data;
    for(let i=0;i<dd.length;i+=4){let g=.299*dd[i]+.587*dd[i+1]+.114*dd[i+2];g=(g-128)*1.6+128;g=g<0?0:g>255?255:g;dd[i]=dd[i+1]=dd[i+2]=g}
    cx.putImageData(px,0,0);ok({cv,mini:cv.toDataURL('image/jpeg',.5)});URL.revokeObjectURL(img.src)};
    img.onerror=mal;img.src=URL.createObjectURL(file)});
}
const sinTilde=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
function leerMonto(txt){
  const lineas=txt.split(/\n/).map(l=>l.trim()).filter(Boolean);
  const malas=/(REF|CUENTA|CTA|APROB|AUTORIZ|NIT|TERMINAL|TERM|CEL|TEL|FECHA|HORA|COMISION|COSTO|IVA|RECIBO|NRO|NO\.|CODIGO|CONVENIO|CC|C\.C|DOC|ID|SALDO|\*{2,}|X{3,})/;
  const buenas=/(VALOR|TOTAL|MONTO|IMPORTE|VLR|PAGO|RETIRO|DEPOSITO|CONSIGNA)/;
  const rx=/\$?\s?(\d{1,3}(?:[.,]\s?\d{3})+(?:[.,]\d{2})?|\d{4,9}(?:[.,]\d{2})?)/g;
  const limpiar=s=>{s=s.replace(/\s/g,'');s=s.replace(/[.,]\d{2}$/,'');return parseInt(s.replace(/\D/g,''),10)||0};
  let mejor=null;
  lineas.forEach((l,i)=>{const L=sinTilde(l);let m;rx.lastIndex=0;
    while((m=rx.exec(l))){const v=limpiar(m[1]);if(v<1000||v>20000000)continue;
      let p=0;if(l.includes('$'))p+=3;if(buenas.test(L))p+=4;if(i>0&&buenas.test(sinTilde(lineas[i-1])))p+=2;if(malas.test(L))p-=6;if(v%50!==0)p-=3;if(v%1000===0)p+=1;
      if(!mejor||p>mejor.p)mejor={v,p}}});
  return mejor&&mejor.p>-3?mejor.v:0;
}
function leerTipo(txt){
  const T=sinTilde(txt);
  if(/NEQUI/.test(T))return /RETIRO|SACAR|ENTREGA/.test(T)?'nequi_out':'nequi_in';
  if(/AVANCE/.test(T))return'avance';
  if(/RETIRO/.test(T))return /CODIGO|SIN TARJETA|TOKEN|OTP/.test(T)?'retiro_cod':'retiro';
  if(/CONSIGNACION|DEPOSITO/.test(T))return'deposito';
  if(/TARJETA DE CREDITO|PAGO TC|PAGO T\.C|TARJ\.? CRED/.test(T))return'tc';
  if(/CREDITO|CUOTA|PRESTAMO|OBLIGACION/.test(T))return'credito';
  if(/RECAUDO|FACTURA|CONVENIO|SERVICIO|PAGO/.test(T))return'factura';
  return'';
}
function leerRef(txt){
  const m=sinTilde(txt).match(/(?:APROB\w*|AUTORIZ\w*|COMPROBANTE|NRO\.? ?TRANS\w*|No\.? ?TRANS\w*|RECIBO|TRANSACCION)\.?\s*(?:NO\.?|N°|#)?\s*:?\s*([0-9]{4,12})/);
  return m?m[1]:'';
}
async function escanear(file){
  openModal(`<h3>Leyendo el comprobante…</h3><div class="sub" id="ocr-est">Preparando la foto</div><div class="barra"><div id="ocr-bar"></div></div>`);
  try{
    const {cv,mini}=await prepararFoto(file);
    document.getElementById('ocr-est').textContent='Cargando el lector (la primera vez demora un poquito)';
    await cargarLector();
    if(!OCR)OCR=await Tesseract.createWorker('spa',1,{logger:m=>{const b=document.getElementById('ocr-bar'),e=document.getElementById('ocr-est');if(!b)return;if(m.status==='recognizing text'){e.textContent='Leyendo el texto';b.style.width=Math.round(m.progress*100)+'%'}}});
    const {data:{text}}=await OCR.recognize(cv);
    modalScan({monto:leerMonto(text),tipo:leerTipo(text),ref:leerRef(text),texto:text,mini});
  }catch(err){
    openModal(`<h3>No se pudo leer</h3><div class="sub">${err&&err.message==='sin internet'?'Para leer comprobantes se necesita internet.':'Intenta otra foto: derecha, con buena luz y sin reflejo.'}</div><button class="primary" data-act="scan">📷 Tomar otra foto</button><button class="ghost" data-act="cerrar">Anotar a mano</button>`);
  }
}

/* ====== Montos en letras y voz (contra el error de un cero de más) ====== */
const U=['','un','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiún','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
const D=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
const CEN=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
function tres(n){if(n===100)return'cien';const c=CEN[Math.floor(n/100)],r=n%100;const rs=r<30?U[r]:D[Math.floor(r/10)]+(r%10?' y '+U[r%10]:'');return[c,rs].filter(Boolean).join(' ')}
function enLetras(n){n=Math.floor(n);if(!n)return'';const mill=Math.floor(n/1e6),mil=Math.floor(n/1000)%1000,r=n%1000,p=[];
  if(mill)p.push(mill===1?'un millón':tres(mill)+' millones');if(mil)p.push(mil===1?'mil':tres(mil)+' mil');if(r)p.push(tres(r));
  return p.join(' ')+((!mil&&!r)?' de pesos':' pesos')}
function decir(n){try{if(!n||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(enLetras(n));u.lang='es-CO';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function tipico(tipo){const v=[];const ks=Object.keys(S.days).sort().reverse();for(const k of ks){for(const m of [...S.days[k].movs].reverse()){if(!tipo||m.tipo===tipo)v.push(m.monto);if(v.length>=40)break}if(v.length>=40)break}
  if(v.length<5)return 0;v.sort((a,b)=>a-b);return v[Math.floor(v.length/2)]}
function esAlto(n,tipo){const t=tipico(tipo);return n>=500000||(t>0&&n>=t*8)}
function cajaMonto(id,tipo){return`<div class="letras" id="${id}-letras"></div><div id="${id}-alerta"></div>`}
function revisarMonto(inp){
  const id=inp.id,n=num(inp.value),tipo=inp.dataset.tipo||'';
  const L=document.getElementById(id+'-letras'),A=document.getElementById(id+'-alerta');if(!L)return;
  L.innerHTML=n?`<b>${enLetras(n).toUpperCase()}</b><button class="voz" data-act="voz" data-for="${id}">🔊</button><span class="cifras">${String(n).length} cifras</span>`:'';
  if(A){if(n&&esAlto(n,tipo)&&n%10===0&&!(id==='m-monto'&&!document.getElementById('s-tipo'))){A.innerHTML=`<div class="alto" data-ok="0"><b>⚠️ Monto alto. ¿Seguro que son ${fmt(n)}?</b>
      <div class="alto-bt"><button data-act="alto-si" data-for="${id}">Sí, son ${fmt(n)}</button><button data-act="alto-no" data-for="${id}" data-v="${n/10}">No, eran ${fmt(n/10)}</button></div></div>`}else A.innerHTML=''}
}
function altoPendiente(id){const a=document.querySelector('#'+id+'-alerta .alto');if(a&&a.dataset.ok!=='1'){a.classList.add('sacude');setTimeout(()=>a.classList.remove('sacude'),500);toast('Confirma el monto primero');return true}return false}

/* ====== Vista HISTORIAL ====== */
function estadoDia(d){
  if(!d.arqueos||!d.arqueos.length)return['gris','Sin contar',null];
  const a=d.arqueos[d.arqueos.length-1];const dif=(a.ef+a.sp)-(a.espEf+a.espSp);
  if(dif===0)return a.ef!==a.espEf?['warn','Falta anotar algo',0]:['ok','Cuadró',0];return[dif<0?'mal':'warn',(dif<0?'Faltaron ':'Sobraron ')+fmt(Math.abs(dif)),dif];
}
function vHist(){
  const el=document.getElementById('v-hist');
  const ks=Object.keys(S.days).filter(k=>{const d=S.days[k];return d.apertura||d.movs.length}).sort().reverse();
  const mesAct=hoyKey().slice(0,7);let difMes=0,diasMes=0,movsMes=0;
  ks.filter(k=>k.startsWith(mesAct)).forEach(k=>{const [,, dif]=estadoDia(S.days[k]);movsMes+=S.days[k].movs.length;if(dif!==null){difMes+=dif;diasMes++}});
  const lista=ks.map(k=>{const d=S.days[k];const [c,t]=estadoDia(d);return`<div class="day" data-act="ver-dia" data-k="${k}"><div><b>${fechaLarga(k)}</b><span>${d.movs.length} movimientos</span></div><span class="tag ${c}">${t}</span></div>`}).join('');
  const nombreMes=new Date().toLocaleDateString('es-CO',{month:'long'});
  el.innerHTML=`<div class="card"><div class="mes"><div><div class="muted" style="text-transform:capitalize">${nombreMes}: ${movsMes} movimientos · ${diasMes} días contados</div><div class="val ${difMes<0?'neg':difMes>0?'neu':'pos'}">${difMes===0?'Sin descuadres':(difMes<0?'Faltan ':'Sobran ')+fmt(Math.abs(difMes))}</div></div></div></div>
    <div class="card" style="padding:4px 12px">${lista||'<div class="empty">Aquí van a aparecer los días.</div>'}</div>
`;
}
function modalDia(k){
  const d=S.days[k];if(!d)return;
  const ap=d.apertura?`<div class="res-row"><span>Apertura</span><span>Efectivo <b>${fmt(d.apertura.ef)}</b> · Plataforma <b>${fmt(d.apertura.sp)}</b></span></div>`:'';

function descargar(nombre,contenido,tipo){const b=new Blob([contenido],{type:tipo});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function csv(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=[['Fecha','Hora','Tipo','Monto','Efectivo','Plataforma','Nota'].join(';')];
  Object.keys(S.days).sort().forEach(k=>{const d=S.days[k];
    if(d.apertura)rows.push([k,hora(d.apertura.ts),'APERTURA','',d.apertura.ef,d.apertura.sp,''].map(q).join(';'));
    d.movs.forEach(m=>{const t=TIPO[m.tipo];rows.push([k,hora(m.ts),t.n,m.monto,t.ef*m.monto,t.sp*m.monto,m.nota||''].map(q).join(';'))});
    (d.arqueos||[]).forEach(a=>rows.push([k,hora(a.ts),a.cierre?'CIERRE':'CONTEO','',a.ef,a.sp,'Debía: efectivo '+a.espEf+' / plataforma '+a.espSp+' / diferencia '+((a.ef+a.sp)-(a.espEf+a.espSp))].map(q).join(';')));
  });
  descargar('caja-corresponsal-'+hoyKey()+'.csv','﻿'+rows.join('\n'),'text/csv;charset=utf-8');
}

document.addEventListener('click',e=>{

  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(act==='ir-contar')setTab('contar');

  else if(act==='rehacer-apertura'){if(b.dataset.ok){day().apertura=null;save();setTab('contar')}else{b.dataset.ok=1;b.textContent='Toca otra vez para confirmar (los movimientos no se borran)'}}
  else if(act==='nuevo'){closeModal();modalNuevo(b.dataset.t)}
  else if(act==='cerrar'){closeModal();guardarBorrador(null)}
  else if(act==='chip'){const i=document.getElementById('m-monto');const v=+b.dataset.v;const n=v?num(i.value)+v:0;i.value=n?'$ '+miles(n):'';revisarMonto(i)}
  else if(act==='guardar-mov'){const n=num(document.getElementById('m-monto').value),tid=b.dataset.t,nt=(document.getElementById('m-nota')||{}).value||'';if(!n){toast('Escribe el monto');document.getElementById('m-monto').focus();return}
    if(esAlto(n,tid)){confirmarAlto(n,tid,nt.trim());return}guardarMov(tid,n,nt.trim())}
  else if(act==='conf-si')guardarMov(b.dataset.t,+b.dataset.n,CONF_NOTA);
  else if(act==='conf-no'){modalNuevo(b.dataset.t,{monto:+b.dataset.n,nota:CONF_NOTA});decir(+b.dataset.n)}
  else if(act==='conf-volver')modalNuevo(b.dataset.t,{monto:+b.dataset.n,nota:CONF_NOTA});
  else if(act==='grupo')modalGrupo(b.dataset.g);
  else if(act==='bienv-ok'){S.nombre=(document.getElementById('nombre').value||'').trim().slice(0,20);S.bienvenida=1;save();closeModal();render()}
  else if(act==='cambiar-nombre'){primeraVez();const i=document.getElementById('nombre');i.value=S.nombre||'';}
  else if(act==='como-instalar')modalInstalar();
  else if(act==='compartir')compartirCopia();
  else if(act==='ver-mov')modalMov(b.dataset.id);
  else if(act==='agregar'){const d=getDay(hoyKey());if(!d||!d.apertura){setTab('contar');toast('Primero cuenta la plata')}else modalAgregar()}
  else if(act==='ver-todo'){VERTODO=!VERTODO;render()}
  else if(act==='voz')decir(num(document.getElementById(b.dataset.for).value));
  else if(act==='alto-si'){const a=b.closest('.alto');a.dataset.ok='1';a.classList.add('ok');a.querySelector('b').textContent='✅ Confirmado: '+fmt(num(document.getElementById(b.dataset.for).value))}
  else if(act==='alto-no'){const i=document.getElementById(b.dataset.for);i.value='$ '+miles(+b.dataset.v);revisarMonto(i);decir(+b.dataset.v)}
  else if(act==='verificar')modalVerificar();
  else if(act==='pend-ok'){if(altoPendiente('v-monto'))return;const n=num(document.getElementById('v-monto').value);if(!n){toast('Escribe el monto');return}decir(n);S.pend={monto:n,ts:Date.now()};save();closeModal();render()}
  else if(act==='pend-x'){S.pend=null;save();render()}
  else if(act==='scan'){closeModal();const c=document.getElementById('camIn');c.value='';c.click()}
  else if(act==='guardar-scan'){const tp=document.getElementById('s-tipo').value,n=num(document.getElementById('m-monto').value),ref=document.getElementById('s-ref').value.replace(/\D/g,'');
    if(!tp){toast('Escoge qué fue');return}if(!n){toast('Escribe el monto');return}if(altoPendiente('m-monto'))return;S.pend=null;
    guardarMov(tp,n,ref?'Aprob. '+ref:'',{ref,foto:1})}
  else if(act==='borrar-mov'){if(b.dataset.ok){const d=day();d.movs=d.movs.filter(m=>m.id!==b.dataset.id);save();closeModal();toast('Movimiento borrado');render()}else{b.dataset.ok=1;b.textContent='Toca otra vez para borrar'}}
  else if(act==='q'){const v=+b.dataset.v;C.q[v]=Math.max(0,(C.q[v]||0)+(+b.dataset.d));C.res=null;guardarConteo();const inp=document.querySelector(`[data-q="${v}"]`);inp.value=C.q[v]||'';document.getElementById('sub-'+v).textContent=C.q[v]?fmt(v*C.q[v]):'';document.getElementById('c-total').textContent=fmt(totalContado());const r=document.getElementById('resultado');if(r)r.remove()}
  else if(act==='limpiar-conteo'){borrarConteo();render()}
  else if(act==='abrir'){const ef=totalContado();const d=day();d.apertura={ef,sp:num(C.sp),conteo:{...C.q},ts:Date.now()};save();borrarConteo();toast('Caja abierta ✅');setTab('hoy')}
  else if(act==='comparar'){const d=day();const e2=esperado(d);C.res={ef:totalContado(),sp:num(C.sp),espEf:e2.ef,espSp:e2.sp};render()}
  else if(act==='guardar-arqueo'||act==='cerrar-dia'){const d=day();const r=C.res;if(!r)return;d.arqueos.push({ts:Date.now(),ef:r.ef,sp:r.sp,espEf:r.espEf,espSp:r.espSp,conteo:{...C.q},cierre:act==='cerrar-dia'});save();borrarConteo();toast(act==='cerrar-dia'?'Día cerrado ✅':'Conteo guardado ✅');setTab('hoy')}
  else if(act==='ver-dia')modalDia(b.dataset.k);
  else if(act==='csv')csv();
  else if(act==='backup'){descargar('copia-caja-'+hoyKey()+'.json',JSON.stringify(S),'application/json');toast('Copia descargada')}
  else if(act==='restore')document.getElementById('fileIn').click();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.q){const v=+t.dataset.q;C.q[v]=Math.max(0,parseInt(t.value,10)||0);C.res=null;guardarConteo();document.getElementById('sub-'+v).textContent=C.q[v]?fmt(v*C.q[v]):'';document.getElementById('c-total').textContent=fmt(totalContado());const r=document.getElementById('resultado');if(r)r.remove()}
  else if(t.id==='c-sp'||t.id==='m-monto'||t.id==='v-monto'){const n=num(t.value);t.value=n?'$ '+miles(n):'';if(t.id==='c-sp'){C.sp=String(n);C.res=null;guardarConteo()}else revisarMonto(t)
    if(t.id==='m-monto'&&t.dataset.tipo&&!document.getElementById('s-tipo'))guardarBorrador({tipo:'mov',tid:t.dataset.tipo,monto:n,nota:(document.getElementById('m-nota')||{}).value||''})}
  else if(t.id==='m-nota'){const i=document.getElementById('m-monto');if(i&&i.dataset.tipo&&!document.getElementById('s-tipo'))guardarBorrador({tipo:'mov',tid:i.dataset.tipo,monto:num(i.value),nota:t.value})}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('modal').hidden===false){const g=document.querySelector('[data-act="guardar-mov"]');if(g)g.click()}});
document.getElementById('camIn').addEventListener('change',e=>{const f=e.target.files[0];if(f)escanear(f)});
document.getElementById('fileIn').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.days)throw 0;S=o;save();toast('Copia recuperada ✅');render()}catch(x){toast('Ese archivo no sirve')}e.target.value=''};
  r.readAsText(f);
});
document.body.classList.add('en-hoy');render();
setTimeout(()=>{const b=leerBorrador();
  if(b&&b.tipo==='mov'&&TIPO[b.tid]&&getDay(hoyKey())&&getDay(hoyKey()).apertura){modalNuevo(b.tid,{monto:b.monto,nota:b.nota});toast('Seguimos donde ibas')}
  else if(!S.bienvenida&&!Object.keys(S.days).length)primeraVez();},300);
</script>
</body>
